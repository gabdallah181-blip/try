<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffe Shop </title>
</head>

<body>
    <header>
        <div class="container">
            <ul class="coffee">
                <img src="images/logo.png" style="width: 1px; height: 1px;" alt="">
                <span>COFFE</span>
            </ul>
            <nav>
                <ul class="acount">
                    <li><a class="home" href="index.html">Home Page</a></li>
                    <li><a class="register" href="register.html">Register</a></li>
                </ul>
            </nav>
        </div>
        
    </header>
    <section>
        <div class="container">
            <form action="">
                <h2>Login</h2>
                <div class="div2 div-content">
                    <p>Email</p>
                    <input type="Email" name="" id="Email" placeholder="Enetr Email">
                </div>
                <div class="div3 div-content">
                    <p>Password</p>
                    <input type="password" name="" id="Password" placeholder="Enetr password">
                </div>
                <div class="div-content">
                    <input type="checkbox" id="checkbox">
                    <span>Remember me</span>
                </div>
                <div class="div-content">
                    <button id="BtnLogin">Login</button>
                    <div>
                        <p>Don't Have an account?</p>
                        <a href="register.html">Register</a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script src="js/login.js"></script>
</body>

</html>
