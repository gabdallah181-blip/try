<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffe Shop </title>
</head>

<body>
    <header>
        <div class="container">
            <ul class="coffee">
                <img src="images/logo.png" style="width: 1px; height: 1px;" alt="">
                <span>COFFE</span>
            </ul>
            <nav>
                <ul class="acount">
                    <li><a class="home" href="index.html">Home Page</a></li>
                    <li><a class="login" href="login.html">login</a></li>
                </ul>
            </nav>
        </div>
        
    </header>
    <section>
        <div class="container">
            <form action="">
                <h2>Register</h2>
                <div class="div-content div1">
                    <div>
                        <p>First Name</p>
                        <input type="text" name="" id="FirstName" placeholder="Enetr first name" minlength="3" maxlength="20">
                    </div>
                    <div>
                        <p>Last Name</p>
                        <input type="text" name="" id="LastName" placeholder="Enetr last name" minlength="3" maxlength="20">
                    </div>
                </div>
                <div class="div-content div2">
                    <p>Email</p>
                    <input type="Email" name="" id="Email" placeholder="Enetr Email" minlength="5" maxlength="50">
                </div>
                <div class="div-content div3">
                    <p>Password</p>
                    <input type="password" name="" id="Password" placeholder="Enetr password" minlength="6" maxlength="10">
                </div>
                <div class="div-content div4">
                    <button id="BtnRegister">Register</button>
                    <div>
                        <p>Have an account?</p>
                        <a href="login.html">login</a>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script src="js/register.js"></script>
</body>

</html>
